<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiro Chat</title>
  <script src="/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; }

    /* Sidebar */
    #sidebar { width: 260px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; transition: width 0.2s; overflow: hidden; }
    #sidebar.collapsed { width: 0; border: none; }
    #sidebar-header { padding: 1rem; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    #sidebar-header h2 { font-size: 0.9rem; color: #94a3b8; font-weight: 500; }
    #session-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .session-item { padding: 0.6rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .session-item:hover { background: #334155; color: #e2e8f0; }
    .session-item { position: relative; }
    .session-item .del-btn { display: none; position: absolute; right: 0.4rem; top: 0.4rem; color: #94a3b8; font-size: 0.85rem; cursor: pointer; padding: 0.1rem 0.3rem; border-radius: 3px; background: #1e293b; }
    .session-item:hover .del-btn { display: inline; }
    .session-item .del-btn:hover { color: #f87171; background: #7f1d1d; }
    .session-item.active { background: #4c1d95; color: #f3e8ff; }
    .session-item.active .del-btn { display: none !important; }

    /* Main */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    /* Header */
    header { padding: 0.75rem 1rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 0.75rem; }
    #toggle-sidebar { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; padding: 0.3rem; }
    #toggle-sidebar:hover { color: #e2e8f0; }
    header h1 { font-size: 1.1rem; color: #a78bfa; flex: 1; }
    header .subtitle { font-size: 0.7rem; color: #64748b; margin-left: 0.5rem; }
    #new-chat-btn { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #7c3aed; background: transparent; color: #a78bfa; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
    #new-chat-btn:hover { background: #7c3aed; color: white; }

    /* Messages */
    #messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }

    /* Welcome */
    #welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 1.5rem; text-align: center; padding: 2rem; }
    #welcome h2 { color: #a78bfa; font-size: 1.5rem; }
    #welcome p { color: #64748b; max-width: 400px; }
    .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; max-width: 500px; }
    .example-btn { padding: 0.5rem 1rem; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 0.8rem; cursor: pointer; }
    .example-btn:hover { border-color: #7c3aed; color: #a78bfa; }

    /* Message bubbles */
    .msg-row { display: flex; gap: 0.75rem; max-width: 85%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot { align-self: flex-start; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0; }
    .msg-row.user .avatar { background: #7c3aed; color: white; }
    .msg-row.bot .avatar { background: #334155; color: #a78bfa; }
    .msg-content { display: flex; flex-direction: column; gap: 0.25rem; }
    .msg-bubble { padding: 0.75rem 1rem; border-radius: 12px; line-height: 1.6; word-wrap: break-word; }
    .msg-row.user .msg-bubble { background: #4c1d95; color: #f3e8ff; border-bottom-right-radius: 4px; }
    .msg-row.bot .msg-bubble { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-bottom-left-radius: 4px; }
    .msg-row.error .msg-bubble { background: #7f1d1d; color: #fca5a5; }
    .msg-bubble img { max-width: 300px; border-radius: 8px; margin-top: 0.5rem; display: block; }
    .msg-meta { font-size: 0.65rem; color: #475569; display: flex; align-items: center; gap: 0.5rem; }
    .msg-row.user .msg-meta { justify-content: flex-end; }
    .copy-btn { background: none; border: none; color: #475569; cursor: pointer; font-size: 0.7rem; padding: 0.1rem 0.3rem; border-radius: 3px; }
    .copy-btn:hover { color: #a78bfa; background: #334155; }

    /* Markdown in bot messages */
    .msg-bubble pre { background: #0f172a; padding: 0.75rem; border-radius: 6px; overflow-x: auto; margin: 0.5rem 0; }
    .msg-bubble code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.85rem; }
    .msg-bubble :not(pre) > code { background: #334155; padding: 0.1rem 0.4rem; border-radius: 3px; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 1.5rem; margin: 0.5rem 0; }
    .msg-bubble p { margin: 0.3rem 0; }
    .msg-bubble a { color: #93c5fd; text-decoration: underline; text-decoration-color: #475569; }
    .msg-bubble a:hover { color: #bfdbfe; text-decoration-color: #93c5fd; }
    .msg-bubble a:visited { color: #c4b5fd; }
    .msg-bubble table { border-collapse: collapse; margin: 0.5rem 0; width: 100%; }
    .msg-bubble th, .msg-bubble td { border: 1px solid #334155; padding: 0.4rem 0.6rem; text-align: left; }
    .msg-bubble th { background: #0f172a; color: #a78bfa; }
    .msg-bubble td { color: #e2e8f0; }
    .msg-bubble strong { color: #f1f5f9; }
    .msg-bubble em { color: #cbd5e1; }
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { margin: 0.5rem 0 0.3rem; color: #a78bfa; }

    /* Typing */
    .typing { align-self: flex-start; color: #94a3b8; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; }
    .spinner { width: 16px; height: 16px; border: 2px solid #334155; border-top-color: #a78bfa; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    .think-text { color: #a78bfa; }
    .think-time { color: #475569; font-size: 0.75rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tool-call { margin: 0.5rem 0; border: 1px solid #334155; border-radius: 6px; overflow: hidden; font-size: 0.8rem; }
    .tool-call summary { padding: 0.4rem 0.75rem; background: #0f172a; color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
    .tool-call summary::marker { color: #475569; }
    .tool-call summary .tool-icon { color: #a78bfa; }
    .tool-call summary .tool-time { margin-left: auto; color: #475569; font-size: 0.7rem; }
    .tool-call pre { margin: 0; padding: 0.5rem 0.75rem; background: #0f172a; color: #94a3b8; font-size: 0.75rem; white-space: pre-wrap; border-top: 1px solid #334155; }

    /* Input */
    #input-area { padding: 0.75rem 1rem; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 0.5rem; align-items: flex-end; }
    #prompt-wrap { flex: 1; position: relative; }
    #prompt { width: 100%; padding: 0.75rem 7rem 0.75rem 0.75rem; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 1rem; resize: none; outline: none; min-height: 44px; max-height: 150px; }
    #prompt:focus { border-color: #7c3aed; }
    .input-actions { position: absolute; right: 0.5rem; bottom: 0.5rem; display: flex; gap: 0.25rem; }
    .input-actions button { background: none; border: none; color: #64748b; font-size: 1rem; cursor: pointer; padding: 0.3rem; border-radius: 4px; }
    .input-actions button:hover { color: #a78bfa; background: #334155; }
    #capture:hover { color: #a78bfa; background: #334155; }
    #send { width: 40px; height: 40px; border-radius: 50%; border: none; background: #7c3aed; color: white; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #send:hover { background: #6d28d9; }
    #send:disabled { background: #334155; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    #stop-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ef4444; background: transparent; color: #ef4444; font-size: 0.9rem; cursor: pointer; display: none; flex-shrink: 0; }
    #stop-btn:hover { background: #ef4444; color: white; border-radius: 50%; }
    .hint { font-size: 0.65rem; color: #475569; padding: 0.25rem 1rem 0; text-align: right; }

    /* Preview */
    #preview { display: none; padding: 0.5rem 1rem; background: #1e293b; align-items: center; gap: 0.5rem; }
    #preview img { max-height: 60px; border-radius: 6px; }
    .file-badge { background:#334155; color:#e2e8f0; padding:0.3rem 0.6rem; border-radius:4px; font-size:0.75rem; } #preview .remove { color: #f87171; cursor: pointer; font-size: 1rem; }

    /* Toast */
    #crop-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; flex-direction:column; align-items:center; justify-content:center; gap:1rem; }
    #crop-modal.active { display:flex; }
    #crop-modal canvas { max-width:90vw; max-height:70vh; cursor:crosshair; border:1px solid #334155; border-radius:4px; }
    #crop-actions { display:flex; gap:0.5rem; }
    #crop-actions button { padding:0.5rem 1.2rem; border-radius:6px; border:none; font-size:0.85rem; cursor:pointer; }
    #crop-confirm { background:#7c3aed; color:white; }
    #crop-confirm:hover { background:#6d28d9; }
    #crop-cancel { background:#334155; color:#e2e8f0; }
    #crop-hint { color:#94a3b8; font-size:0.8rem; }
    #drop-overlay { display:none; position:fixed; inset:0; background:rgba(124,58,237,0.15); border:3px dashed #7c3aed; z-index:150; align-items:center; justify-content:center; }
    #drop-overlay.active { display:flex; }
    #drop-overlay span { background:#1e293b; color:#a78bfa; padding:1rem 2rem; border-radius:12px; font-size:1.1rem; }
    #toast.error { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }
    #toast { position: fixed; top: 1rem; right: 1rem; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 0.75rem 1rem; border-radius: 8px; display: none; z-index: 100; font-size: 0.85rem; max-width: 400px; }

    /* Light theme */
    body.light { background: #f8fafc; color: #1e293b; }
    body.light #sidebar, body.light header, body.light #input-area, body.light #settings-bar { background: #ffffff; border-color: #e2e8f0; }
    body.light #prompt { background: #f1f5f9; color: #1e293b; border-color: #e2e8f0; }
    body.light .msg-row.bot .msg-bubble { background: #f1f5f9; color: #1e293b; border-color: #e2e8f0; }
    body.light .msg-row.user .msg-bubble { background: #7c3aed; }
    body.light .msg-bubble pre { background: #f1f5f9; }
    body.light .msg-bubble code { background: #e2e8f0; }
    body.light .session-item:hover { background: #f1f5f9; color: #1e293b; }
    body.light .msg-bubble a { color: #2563eb; }
    body.light #welcome p { color: #64748b; }
    body.light .example-btn { background: #f1f5f9; border-color: #e2e8f0; color: #475569; }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar { display: none; }
      .msg-row { max-width: 95%; }
      #messages { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header"><h2>Sessions</h2></div><div style="padding:0.5rem"><input id="session-search" type="text" placeholder="Search sessions..." style="width:100%;padding:0.4rem 0.6rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:0.75rem;outline:none" /></div>
    <div id="session-list"></div>
  </div>
  <div id="main">
    <header>
      <button id="toggle-sidebar" aria-label="Toggle sidebar">☰</button>
      <h1>Kiro Chat<span class="subtitle">powered by kiro-cli</span></h1>
      <span id="session-indicator" style="font-size:0.7rem;color:#475569"></span>
      <button id="settings-toggle" title="Settings" style="padding:0.4rem 0.6rem;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:1rem;cursor:pointer">⚙️</button>
      <button id="export-btn" title="Export chat" style="padding:0.4rem 0.6rem;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:0.8rem;cursor:pointer">⬇</button>
      <button id="new-chat-btn">✨ New Chat</button>
    </header>
    <div id="settings-bar" style="display:none;padding:0.5rem 1rem;background:#16213e;border-bottom:1px solid #334155;gap:0.75rem;align-items:center;flex-wrap:wrap">
      <label style="font-size:0.7rem;color:#94a3b8">Model:</label>
      <select id="model-select" title="Switch model" style="padding:0.3rem 0.5rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:0.75rem;cursor:pointer"><option value="auto">auto</option></select>
      <label style="font-size:0.7rem;color:#94a3b8">Agent:</label>
      <select id="agent-select" title="Switch agent" style="padding:0.3rem 0.5rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:0.75rem;cursor:pointer;max-width:160px"><option value="">Default</option></select>
      <button id="theme-btn" title="Toggle theme" style="padding:0.3rem 0.5rem;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:0.85rem;cursor:pointer">☀️</button>
      <span style="font-size:0.65rem;color:#475569;margin-left:auto">Ctrl+/ for shortcuts</span>
    </div>
    <div id="messages">
      <div id="welcome">
        <h2 id="welcome-greeting">👋 Hey!</h2>
        <p>What can I help you with?</p>
        <div class="examples">
          <button class="example-btn" data-send="true">💡 What tools do you have access to?</button>
          <button class="example-btn" data-send="true">📄 Summarize a file for me</button>
          <button class="example-btn">🔍 Search for...</button>
          <button class="example-btn">📝 Help me write...</button>
        </div>
        <div id="welcome-footer" style="font-size:0.7rem;color:#475569;margin-top:0.5rem"></div>
      </div>
    </div>
    <div id="preview"><img id="preview-img"><span class="remove">✕</span></div>
    <div id="input-area">
      <div id="prompt-wrap">
        <textarea id="prompt" rows="1" placeholder="Message Kiro... (type /help for commands)" aria-label="Chat input"></textarea>
        <div class="input-actions">
          <button id="voice-btn" aria-label="Voice input" title="Voice input">🎤</button>
          <button id="attach" aria-label="Attach file" title="Attach file">📎</button>
          <button id="capture" aria-label="Screenshot" title="Screenshot">📷</button>
        </div>
      </div>
      <button id="send" aria-label="Send">↑</button>
      <button id="stop-btn">■</button>
    </div>
  <div id="drop-overlay"><span>Drop file here</span></div><input type="file" id="file-input" hidden /><div id="crop-modal"><p id="crop-hint">Click and drag to select a region, or confirm to use full image</p><canvas id="crop-canvas"></canvas><div id="crop-actions"><button id="crop-confirm">✓ Use Selection</button><button id="crop-cancel">✕ Cancel</button></div></div>
  <div id="toast" role="alert" aria-live="assertive"></div>

  <script>
    const messages = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    const input = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const stopBtn = document.getElementById('stop-btn');
    const captureBtn = document.getElementById('capture');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('preview-img');
    const toast = document.getElementById('toast');
    let screenshotData = null;
    let controller = null;

    function showToast(msg, ms, type) {
      ms = ms || 4000;
      toast.textContent = msg;
      toast.className = type === 'error' ? 'error' : '';
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, ms);
    }

    function timeStr() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function safeMd(text) {
      if (typeof marked === 'undefined') return esc(text).replace(/\n/g, '<br>');
      var html = marked.parse(text);
      var div = document.createElement('div'); div.innerHTML = html;
      div.querySelectorAll('script,iframe,object,embed').forEach(el => el.remove());
      div.querySelectorAll('*').forEach(el => { for (var a of [...el.attributes]) { if (a.name.startsWith('on')) el.removeAttribute(a.name); } });
      return div.innerHTML;
    }

    function formatBotResponse(text) {
      // Match tool call blocks: "Running tool X ... Completed in Ys" 
      const toolRegex = /Running tool (\S+) with the param \(from mcp server: (\S+)\)[\s\S]*?\{([\s\S]*?)\}\n*(?:Completed in ([\d.]+s))?/g;
      let lastIdx = 0;
      let result = '';
      let match;
      while ((match = toolRegex.exec(text)) !== null) {
        // Add text before this tool call
        const before = text.slice(lastIdx, match.index).trim();
        if (before) result += safeMd(before);
        // Build collapsible tool call
        const toolName = match[1];
        const server = match[2];
        const params = match[3].trim();
        const time = match[4] || '';
        result += '<details class="tool-call"><summary><span class="tool-icon">⚡</span>' + esc(toolName) + ' <span style="color:#475569">via ' + esc(server) + '</span>' + (time ? '<span class="tool-time">' + esc(time) + '</span>' : '') + '</summary><pre>{' + esc(params) + '}</pre></details>';
        lastIdx = match.index + match[0].length;
      }
      // Add remaining text after last tool call
      const after = text.slice(lastIdx).trim();
      if (after) result += safeMd(after);
      return result || safeMd(text);
    }

    function addMessage(text, cls, imgSrc) {
      if (welcome.parentNode) welcome.remove();
      const row = document.createElement('div');
      row.className = 'msg-row ' + cls;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = cls === 'user' ? 'U' : 'K';

      const content = document.createElement('div');
      content.className = 'msg-content';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      if (cls === 'bot') {
        bubble.innerHTML = formatBotResponse(text);
      } else {
        bubble.textContent = text;
      }
      if (imgSrc) {
        const img = document.createElement('img');
        img.src = imgSrc;
        bubble.appendChild(img);
      }

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = timeStr() + (cls === "bot" && avgTime(modelSelect ? modelSelect.value : "auto") ? " • " + avgTime(modelSelect.value) : "");
      if (cls === 'bot') {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = '📋 Copy';
        copyBtn.onclick = () => { navigator.clipboard.writeText(text); copyBtn.textContent = '✓ Copied'; setTimeout(() => copyBtn.textContent = '📋 Copy', 2000); };
        meta.appendChild(copyBtn);
      }

      content.appendChild(bubble);
      content.appendChild(meta);
      row.appendChild(avatar);
      row.appendChild(content);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    async function captureScreen() {
      try {
        captureBtn.disabled = true;
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const track = stream.getVideoTracks()[0];
        const fullCanvas = document.createElement('canvas');
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        fullCanvas.width = video.videoWidth;
        fullCanvas.height = video.videoHeight;
        fullCanvas.getContext('2d').drawImage(video, 0, 0);
        track.stop();
        openCropModal(fullCanvas);
      } catch (e) {
        if (e.name !== 'NotAllowedError') showToast('Screenshot failed: ' + e.message, 4000, 'error');
      }
      captureBtn.disabled = false;
    }

    function openCropModal(fullCanvas) {
      const modal = document.getElementById('crop-modal');
      const cropCanvas = document.getElementById('crop-canvas');
      const ctx = cropCanvas.getContext('2d');
      // Scale down for display
      const scale = Math.min(window.innerWidth * 0.9 / fullCanvas.width, window.innerHeight * 0.7 / fullCanvas.height, 1);
      cropCanvas.width = fullCanvas.width * scale;
      cropCanvas.height = fullCanvas.height * scale;
      ctx.drawImage(fullCanvas, 0, 0, cropCanvas.width, cropCanvas.height);
      modal.classList.add('active');

      let startX, startY, endX, endY, dragging = false;
      function drawSelection() {
        ctx.drawImage(fullCanvas, 0, 0, cropCanvas.width, cropCanvas.height);
        if (startX != null && endX != null) {
          const x = Math.min(startX, endX), y = Math.min(startY, endY);
          const w = Math.abs(endX - startX), h = Math.abs(endY - startY);
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
          ctx.clearRect(x, y, w, h);
          ctx.drawImage(fullCanvas, x/scale, y/scale, w/scale, h/scale, x, y, w, h);
          ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
        }
      }
      cropCanvas.onmousedown = (e) => { const r = cropCanvas.getBoundingClientRect(); startX = e.clientX - r.left; startY = e.clientY - r.top; endX = startX; endY = startY; dragging = true; };
      cropCanvas.onmousemove = (e) => { if (!dragging) return; const r = cropCanvas.getBoundingClientRect(); endX = e.clientX - r.left; endY = e.clientY - r.top; drawSelection(); };
      cropCanvas.onmouseup = () => { dragging = false; };

      function cleanup() { modal.classList.remove('active'); cropCanvas.onmousedown = cropCanvas.onmousemove = cropCanvas.onmouseup = null; }

      document.getElementById('crop-confirm').onclick = () => {
        let out;
        if (startX != null && endX != null && Math.abs(endX - startX) > 10 && Math.abs(endY - startY) > 10) {
          const x = Math.min(startX, endX) / scale, y = Math.min(startY, endY) / scale;
          const w = Math.abs(endX - startX) / scale, h = Math.abs(endY - startY) / scale;
          out = document.createElement('canvas'); out.width = w; out.height = h;
          out.getContext('2d').drawImage(fullCanvas, x, y, w, h, 0, 0, w, h);
        } else {
          out = fullCanvas;
        }
        screenshotData = out.toDataURL('image/png');
        previewImg.src = screenshotData;
        preview.style.display = 'flex';
        if (!input.value.trim()) input.value = 'Analyze this screenshot';
        cleanup();
      };
      document.getElementById('crop-cancel').onclick = cleanup;
    }

    async function send() {
      const prompt = input.value.trim();
      // Slash commands
      if (prompt.startsWith("/")) {
        var parts = prompt.split(" ");
        var cmd = parts[0].toLowerCase();
        if (cmd === "/clear") { input.value = ""; newChat(); return; }
        if (cmd === "/export") { input.value = ""; document.getElementById("export-btn").click(); return; }
        if (cmd === "/model") { input.value = ""; var m = parts[1]; var NL = String.fromCharCode(10); if (m) { modelSelect.value = m; modelSelect.dispatchEvent(new Event("change")); addMessage("/model " + m, "user"); addMessage("Switched to model: **" + m + "**", "bot"); } else { addMessage("/model", "user"); var opts = []; for(var j=0;j<modelSelect.options.length;j++) { var o=modelSelect.options[j]; opts.push("- " + (o.selected? "**"+o.value+"** \u2714" : o.value)); } addMessage("**Available models:**" + NL + NL + opts.join(NL) + NL + NL + "Use `/model <name>` to switch.", "bot"); } return; }
        if (cmd === "/agent") { input.value = ""; var a = parts[1]; var NL = String.fromCharCode(10); if (a) { agentSelect.value = a; agentSelect.dispatchEvent(new Event("change")); addMessage("/agent " + a, "user"); addMessage("Switched to agent: **" + a + "**", "bot"); } else { addMessage("/agent", "user"); var opts = []; for(var j=0;j<agentSelect.options.length;j++) { var o=agentSelect.options[j]; opts.push("- " + (o.selected? "**"+o.value+"** \u2714" : o.value)); } addMessage("**Available agents:**" + NL + NL + opts.join(NL) + NL + NL + "Use `/agent <name>` to switch.", "bot"); } return; }
        if (cmd === "/templates") { input.value = ""; addMessage("/templates", "user"); var tpls = JSON.parse(localStorage.getItem("kiro-templates") || "{}"); var keys = Object.keys(tpls); addMessage(keys.length ? "**Saved templates:**\n" + keys.map(function(k){return "- " + k}).join("\n") + "\n\nUse /use <name> to load." : "No saved templates yet. Use /save <name> then type your prompt.", "bot"); return; }
        if (cmd === "/use") { input.value = ""; var tname = parts.slice(1).join(" "); var tpls2 = JSON.parse(localStorage.getItem("kiro-templates") || "{}"); if (tpls2[tname]) { input.value = tpls2[tname]; input.focus(); } else { showToast("Template not found: " + tname); } return; }
        if (cmd === "/help") { input.value = ""; addMessage("/help", "user"); addMessage("**Available commands:**\n- \`/clear\` \u2014 New chat session\n- \`/export\` \u2014 Download as markdown\n- \`/model <name>\` \u2014 Switch model\n- \`/agent <name>\` \u2014 Switch agent\n- \`/save <name>\` \u2014 Save next message as template\n- \`/use <name>\` \u2014 Load saved template\n- \`/templates\` \u2014 List templates\n- \`/help\` \u2014 This help\n\n**Shortcuts:** Ctrl+K search, Ctrl+N new chat, Ctrl+/ help", "bot"); return; }
      }
      // Save as template if pending
      var pendingTpl = localStorage.getItem("kiro-pending-template");
      if (pendingTpl && prompt) {
        var tpls3 = JSON.parse(localStorage.getItem("kiro-templates") || "{}");
        tpls3[pendingTpl] = prompt;
        localStorage.setItem("kiro-templates", JSON.stringify(tpls3));
        localStorage.removeItem("kiro-pending-template");
        showToast("Template saved: " + pendingTpl, 2000);
      }
      if (!prompt && !screenshotData) return;
      const userText = prompt || 'Analyze this screenshot';
      const savedInput = input.value;
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      sendBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      addMessage(userText, 'user', (screenshotData && typeof screenshotData === 'string') ? previewImg.src : null);

      const typing = document.createElement('div');
      typing.className = 'typing';
      const thinkMsgs = ['Thinking','Analyzing your request','Consulting knowledge base','Searching through context','Crafting a response','Almost there'];
      let msgIdx = 0;
      const startTs = Date.now();
      typing.innerHTML = '<span class="spinner"></span><span class="think-text">Thinking</span><span class="think-time"></span>';
      const thinkInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTs) / 1000);
        msgIdx = Math.min(Math.floor(elapsed / 4), thinkMsgs.length - 1);
        typing.querySelector('.think-text').textContent = thinkMsgs[msgIdx];
        typing.querySelector('.think-time').textContent = elapsed > 2 ? ' • ' + elapsed + 's' : '';
      }, 500);
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      const payload = { prompt: userText };
      if (screenshotData) {
        if (screenshotData.type === 'file') {
          payload.file = { name: screenshotData.name, content: screenshotData.content };
        } else {
          payload.screenshot = screenshotData;
        }
        screenshotData = null;
        preview.style.display = 'none';
        previewImg.style.display = ''; previewImg.alt = '';
        const fb = preview.querySelector('.file-badge'); if (fb) fb.remove();
      }

      controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 90000);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeout);
        const json = await res.json();
        (clearInterval(thinkInterval), typing.remove());
        if (json.success) {
          addMessage(json.data || '(empty response)', 'bot');
          updateSessionIndicator();
        } else {
          showToast('Error: ' + json.error, 4000, 'error');
        }
      } catch (e) {
        clearTimeout(timeout);
        (clearInterval(thinkInterval), typing.remove());
        if (e.name === 'AbortError') {
          showToast('Request cancelled / timed out', 4000, 'error');
        input.value = savedInput;
        } else {
          showToast('Connection error: ' + e.message, 4000, 'error');
        input.value = savedInput;
        }
      }
      controller = null;
      sendBtn.disabled = false;
      sendBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
      input.focus();
    }

    function stopRequest() {
      if (controller) controller.abort();
    }

    async function newChat() {
      document.getElementById('session-indicator').textContent = '';
      await fetch('/api/clear', { method: 'POST' });
      messages.innerHTML = '';
      messages.appendChild(welcome);
      screenshotData = null;
      preview.style.display = 'none';
    }

    // Sidebar toggle
    document.getElementById('toggle-sidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
    });

    // Example prompts
    document.querySelectorAll('.example-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        input.value = btn.textContent.replace(/^[^\w]+/, '').trim();
        if (btn.dataset.send) { send(); } else { input.focus(); }
      });
    });

    document.getElementById('new-chat-btn').addEventListener('click', newChat);
    stopBtn.addEventListener('click', stopRequest);
    captureBtn.addEventListener('click', captureScreen);
    document.querySelector('#preview .remove').addEventListener('click', () => { screenshotData = null; preview.style.display = 'none'; previewImg.style.display = ''; previewImg.alt = ''; const fb = preview.querySelector('.file-badge'); if (fb) fb.remove(); });
    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; });

    // File attach & drag-drop
    const fileInput = document.getElementById('file-input');
    const dropOverlay = document.getElementById('drop-overlay');
    document.getElementById('attach').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleImageFile(e.target.files[0]); fileInput.value = ''; });

    function handleImageFile(file) {
      if (file.size > 10 * 1024 * 1024) { showToast('File too large (max 10MB)', 4000, 'error'); return; }
      const reader = new FileReader();
      if (file.type.startsWith('image/')) {
        reader.onload = (e) => {
          screenshotData = e.target.result;
          previewImg.src = screenshotData;
          previewImg.style.display = '';
          preview.style.display = 'flex';
          if (!input.value.trim()) input.value = 'Analyze this image';
          input.focus();
        };
        reader.readAsDataURL(file);
      } else {
        const isText = file.type.startsWith('text/') || /.(txt|md|json|ya?ml|log|csv|js|ts|py|java|sh|html|css|xml|sql|conf|cfg|ini|toml|env|rb|go|rs|c|cpp|h)$/i.test(file.name);
        if (isText) {
          reader.onload = (e) => {
            screenshotData = { name: file.name, content: e.target.result, type: 'file' };
            showFilePreview(file.name);
          };
          reader.readAsText(file);
        } else {
          reader.onload = (e) => {
            const base64 = e.target.result.split(',')[1];
            screenshotData = { name: file.name, content: base64, encoding: 'base64', type: 'file' };
            showFilePreview(file.name);
          };
          reader.readAsDataURL(file);
        }
      }
    }
    function showFilePreview(name) {
      previewImg.style.display = 'none';
      preview.style.display = 'flex';
      const existing = preview.querySelector('.file-badge');
      if (existing) existing.remove();
      preview.querySelector('.remove').insertAdjacentHTML('beforebegin', '<span class="file-badge">📄 ' + name + '</span>');
      if (!input.value.trim()) input.value = 'Analyze this file';
      input.focus();
    }

    // Drag and drop
    let dragCounter = 0;
    document.addEventListener('dragenter', (e) => { e.preventDefault(); dragCounter++; dropOverlay.classList.add('active'); });
    document.addEventListener('dragleave', (e) => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); } });
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
      e.preventDefault(); dragCounter = 0; dropOverlay.classList.remove('active');
      const file = e.dataTransfer.files[0];
      if (file) handleImageFile(file);
    });

    // Agent picker
    const agentSelect = document.getElementById('agent-select');
    fetch('/api/agents').then(r=>r.json()).then(d => {
      if (d.success && d.data.length) {
        d.data.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.name;
          opt.textContent = a.name;
          if (a.active) opt.selected = true;
          agentSelect.appendChild(opt);
        });
      }
    }).catch(()=>{});
    agentSelect.addEventListener('change', async () => {
      await fetch('/api/set-agent', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({agent: agentSelect.value}) });
      // Reset session when switching agents
      await fetch('/api/clear', { method:'POST' });
      messages.innerHTML = '';
      messages.appendChild(welcome);
      document.getElementById('session-indicator').textContent = '';
      showToast('Switched to: ' + (agentSelect.value || 'Default Agent'), 2000);
      const wf2 = document.getElementById('welcome-footer'); if (wf2) wf2.textContent = 'Agent: ' + (agentSelect.value || 'default') + ' | Tools connected';
    });

    // Settings panel toggle
    document.getElementById("settings-toggle").addEventListener("click", function() {
      var bar = document.getElementById("settings-bar");
      bar.style.display = bar.style.display === "none" ? "flex" : "none";
    });

    // === Response time tracking ===
    var modelTimes = {};
    function recordTime(model, ms) {
      if (!modelTimes[model]) modelTimes[model] = [];
      modelTimes[model].push(ms);
    }
    function avgTime(model) {
      var t = modelTimes[model];
      if (!t || !t.length) return "";
      return (t.reduce(function(a,b){return a+b},0) / t.length / 1000).toFixed(1) + "s avg";
    }

    // === Export conversation ===
    document.getElementById("export-btn").addEventListener("click", function() {
      var rows = document.querySelectorAll(".msg-row");
      if (!rows.length) { showToast("Nothing to export"); return; }
      var md = "# Kiro Chat Export\n\n";
      rows.forEach(function(row) {
        var isUser = row.classList.contains("user");
        var bubble = row.querySelector(".msg-bubble");
        var text = bubble ? bubble.textContent.trim() : "";
        md += (isUser ? "**You:** " : "**Kiro:** ") + text + "\n\n";
      });
      var blob = new Blob([md], {type:"text/markdown"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "kiro-chat-" + new Date().toISOString().slice(0,10) + ".md";
      a.click();
      showToast("Exported!", 2000);
    });

    // === Theme toggle ===
    var themeBtn = document.getElementById("theme-btn");
    themeBtn.addEventListener("click", function() {
      document.body.classList.toggle("light");
      themeBtn.textContent = document.body.classList.contains("light") ? "🌙" : "☀️";
      localStorage.setItem("kiro-theme", document.body.classList.contains("light") ? "light" : "dark");
    });
    if (localStorage.getItem("kiro-theme") === "light") { document.body.classList.add("light"); themeBtn.textContent = "🌙"; }

    // === Voice input ===
    var voiceBtn = document.getElementById("voice-btn");
    var recognition = null;
    if (window.SpeechRecognition || window.webkitSpeechRecognition) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onresult = function(e) { input.value += e.results[0][0].transcript; input.focus(); };
      recognition.onend = function() { voiceBtn.style.color = "#64748b"; };
    }
    voiceBtn.addEventListener("click", function() {
      if (!recognition) { showToast("Speech recognition not supported in this browser"); return; }
      voiceBtn.style.color = "#ef4444";
      recognition.start();
    });

    // === Keyboard shortcuts ===
    document.addEventListener("keydown", function(e) {
      if (e.ctrlKey && e.key === "k") { e.preventDefault(); var s = document.getElementById("session-search"); if (s) s.focus(); }
      if (e.ctrlKey && e.key === "n") { e.preventDefault(); newChat(); }
      if (e.ctrlKey && e.key === "/") { e.preventDefault(); showToast("Shortcuts: Ctrl+K=Search, Ctrl+N=New, Ctrl+/=Help, /commands in input", 5000); }
    });

    // === Slash commands ===
    // Handled in send() - intercepted before API call

    // === Prompt templates ===
    // Stored in localStorage

    // Model picker
    var modelSelect = document.getElementById("model-select");
    fetch("/api/models").then(function(r){return r.json()}).then(function(d){
      if(d.success && d.data.length) d.data.forEach(function(m){
        if(m.id==="auto") return;
        var opt=document.createElement("option"); opt.value=m.id; opt.textContent=m.name+" ("+m.cost+"x)"; modelSelect.appendChild(opt);
      });
    }).catch(function(){});
    modelSelect.addEventListener("change",function(){
      fetch("/api/set-model",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:modelSelect.value})});
      showToast("Model: "+modelSelect.value, 2000);
    });

    // Welcome name & footer
    fetch('/api/whoami').then(r=>r.json()).then(d => {
      if (d.name) { var el = document.getElementById('welcome-greeting'); if (el) el.textContent = '👋 Hey ' + d.name.split(' ')[0] + '!'; }
    }).catch(()=>{});
    var wf = document.getElementById('welcome-footer');
    if (wf) wf.textContent = 'Agent: ' + (agentSelect.value || 'default') + ' | Tools connected';

    // Sessions sidebar
    const sessionList = document.getElementById('session-list');
    async function loadSessions() {
      try {
        const res = await fetch('/api/sessions');
        const json = await res.json();
        if (!json.success || !json.data.length) { sessionList.innerHTML = '<div style="padding:1rem;color:#475569;font-size:0.8rem">No sessions yet</div>'; return; }
        sessionList.innerHTML = json.data.map(s => {
          const title = (s.title || 'Untitled').slice(0, 50);
          const ago = timeAgo(s.updated);
          return '<div class="session-item" data-id="' + esc(s.id) + '" title="' + esc(title) + '"><span class="del-btn" data-del="' + esc(s.id) + '">✕</span><div>' + esc(title) + '</div><div style="font-size:0.65rem;color:#475569;margin-top:2px">' + ago + '</div></div>';
        }).join('');
      } catch(e) {}
    }
    function timeAgo(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff/60) + 'm ago';
      if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
      return Math.floor(diff/86400) + 'd ago';
    }
    loadSessions();

    // Session click to resume
    sessionList.addEventListener('click', async (e) => {
      var delBtn = e.target.closest('.del-btn');
      if (delBtn) {
        e.stopPropagation();
        await fetch('/api/delete-session', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({sessionId: delBtn.dataset.del}) });
        delBtn.closest('.session-item').remove();
        return;
      }
      const item = e.target.closest('.session-item');
      if (!item) return;
      const sid = item.dataset.id;
      // Set server session to this ID
      await fetch('/api/clear', { method: 'POST' });
      await fetch('/api/set-session', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({sessionId: sid}) });
      // Update UI
      messages.innerHTML = '';
      if (welcome.parentNode) welcome.remove();
      addMessage('(Resumed session: ' + (item.title || item.textContent.split('\n')[0]) + ')', 'bot');
      sessionList.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      updateSessionIndicator();
    });

    var _sessionTimer = null;
    function refreshSessionsDebounced() { clearTimeout(_sessionTimer); _sessionTimer = setTimeout(loadSessions, 2000); }


    function updateSessionIndicator() {
      fetch('/api/session-info').then(r=>r.json()).then(d => {
        document.getElementById('session-indicator').textContent = d.active ? '● Session active' : '';
        document.getElementById('session-indicator').style.color = d.active ? '#4ade80' : '#475569';
        refreshSessionsDebounced();
      }).catch(()=>{});
    }
    updateSessionIndicator();
    // Refresh indicator after each send
    
    document.getElementById('session-search').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      sessionList.querySelectorAll('.session-item').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
